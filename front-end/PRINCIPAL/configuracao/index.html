<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações da Conta</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>

  <main class="profile-content">
    <div class="main-wrapper">
        
     <a href="../index.html"> <i class='bx bx-log-out btn-voltar'></i> </a>
        
        <h1>Configurações da Conta</h1>

        <form id="form-conta">
            <div class="form-group">
                <label for="input-senha-atual">Senha Atual</label> 
                <input type="password" id="input-senha-atual" placeholder="Digite a senha atual" disabled required>
             <i class='bx bx-lock'></i>
            </div>
            
            <div class="form-group">
                <label for="input-nova-senha">Nova Senha</label>    
                <input type="password" id="input-nova-senha" placeholder="Digite a nova senha" disabled required>
                <i class='bx bx-lock'></i>
            </div>

            <button type="submit" id="btn-acao" class="btn-salvar" >Deseja alterar informações?</button>

            <div class="form-group" style="margin-top: 25px;">
                <h3>  Preferências do Sistema </h3>
                
                <button type="button" id="btn-tema" class="btn-salvar btn-block">
                    <i class="fa-solid fa-sun"></i> Modo Claro
                </button>
            </div>
        </form>

    </div>
  </main> 

  <script src="script.js"></script>
</body>
</html>
